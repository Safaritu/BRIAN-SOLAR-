<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MKU 2026 / 2027 Poster</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background: #101010;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* ================= POSTER ================= */
    .poster {
      width: 100%;
      max-width: 420px;
      background: #f4f6f8; /* SOLID background */
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    /* ================= TOP IMAGE ================= */
    .hero {
      background: url("MKU BACKGROUND.jpeg") center / cover no-repeat;
      height: 160px;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.55)
      );
    }

    /* ================= LOGOS ================= */
    .top-logos {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 2;
    }

    .logo {
      width: 40px;
      background: #fff;
      padding: 4px;
      border-radius: 8px;
    }

    /* ================= TITLE ================= */
    .title {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      z-index: 2;
    }

    .title span {
      font-size: 16px;
      font-weight: 600;
    }

    /* ================= CONTENT ================= */
    .content {
      padding: 16px;
      display: flex;
      gap: 16px;
    }

    /* ================= MANIFESTO ================= */
    .manifesto {
      flex: 1.2;
    }

    .manifesto h3 {
      color: #8b0000;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
      border-left: 5px solid #8b0000;
      padding-left: 10px;
      text-transform: uppercase;
    }

    .manifesto ul {
      list-style: none;
    }

    .manifesto li {
      background: #ffffff;
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #111;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .manifesto li span {
      min-width: 22px;
      height: 22px;
      background: #8b0000;
      color: #fff;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ================= CANDIDATE ================= */
    .candidate {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .candidate img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 14px;
      background: #ffffff;
      padding: 6px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    }

    /* ================= VOTE ================= */
    .vote {
      text-align: center;
      padding: 14px 10px;
      background: #ffffff;
      border-top: 1px solid #ddd;
    }

    .vote-text {
      color: #8b0000;
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .vote h2 {
      font-size: 26px;
      font-weight: 900;
      color: #000;
      margin: 4px 0;
    }

    .hashtag {
      font-size: 13px;
      color: #444;
      font-weight: 600;
    }

    /* ================= POSITION ================= */
    .position {
      background: #8b0000;
      color: #fff;
      text-align: center;
      padding: 16px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 420px) {
      .content {
        flex-direction: column;
      }

      .candidate img {
        max-height: 280px;
        margin-top: 10px;
      }

      .logo {
        width: 36px;
      }

      .title {
        font-size: 20px;
      }
    }

    @media (max-width: 360px) {
      .manifesto li {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="poster">

    <!-- Hero / Background Image -->
    <div class="hero">
      <div class="top-logos">
        <img src="LOGO1.jpeg" class="logo" alt="MKU Logo">
        <img src="LOGO2.jpeg" class="logo" alt="MKUSA Logo">
      </div>

      <div class="title">
        MKU <span>2026 / 2027</span>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <div class="manifesto">
        <h3>Manifesto</h3>
        <ul>
          <li><span>1</span> Transparent & accountable leadership</li>
          <li><span>2</span> Effective communication</li>
          <li><span>3</span> Accessibility to students</li>
          <li><span>4</span> Inclusive representation & student voice</li>
          <li><span>5</span> Mental health awareness</li>
        </ul>
      </div>

      <div class="candidate">
        <img src="STEPHEN MULII.jpeg" alt="Muli Kituva">
      </div>

    </div>

    <!-- Vote -->
    <div class="vote">
      <p class="vote-text">Vote</p>
      <h2>MULI KITUV​A</h2>
      <p class="hashtag">#LeadershipYouCanReach</p>
    </div>

    <!-- Position -->
    <div class="position">
      Secretary General
    </div>

  </div>

</body>
</html>
