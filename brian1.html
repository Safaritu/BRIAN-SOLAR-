<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MKUSA 2026/2027 Poster</title>
  <link rel="stylesheet" href="mkusa_flyer_final.css" />
</head>
<body>

  <div class="poster">

    <!-- Top Logos -->
    <div class="top-logos">
      <img src="LOGO1.jpeg" alt="MKU Logo" class="logo left">
      <img src="LOGO2.jpeg" alt="MKUSA Logo" class="logo right">
    </div>

    <!-- Title -->
    <div class="title">
      MKUSA <span>2026 / 2027</span>
    </div>

    <!-- Main Content -->
    <div class="content">

      <!-- Manifesto -->
      <div class="manifesto">
        <h3>Manifesto</h3>
        <ul>
          <li>Transparent & accountable leadership</li>
          <li>Effective communication</li>
          <li>Accessibility to students</li>
          <li>Inclusive representation & student voice</li>
          <li>Mental health awareness</li>
        </ul>
      </div>

      <!-- Candidate -->
      <div class="candidate">
        <img src="STEPHEN MULII.jpeg" alt="Muli Kituva">
      </div>

    </div>

    <!-- Vote Section -->
    <div class="vote">
      <p class="vote-text">Vote</p>
      <h2>MULI KITUV​A</h2>
      <p class="hashtag">#LeadershipYouCanReach</p>
    </div>

    <!-- Position -->
    <div class="position">
      SECRETARY GENERAL
    </div>

  </div>

</body>
</html>
