<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKU 2026 / 2027 Poster</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  background: #101010;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh; /* NO SCROLL */
}

/* ================= POSTER ================= */
.poster {
  width: 100%;
  max-width: 420px;
  height: 100vh; /* FIT SCREEN */
  background: #f4f6f8;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
}

/* ================= HERO ================= */
.hero {
  position: relative;
  height: 160px;
  background: url("MKU BACKGROUND.jpeg") center / cover no-repeat;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.65));
}

/* ================= LOGOS ================= */
.top-logos {
  position: absolute;
  top: 10px;
  left: 0;
  right: 0;
  padding: 0 14px;
  display: flex;
  justify-content: space-between;
  z-index: 2;
}

.logo {
  width: 40px;
  background: #fff;
  padding: 5px;
  border-radius: 10px;
}

/* ================= TITLE ================= */
.title {
  position: absolute;
  bottom: 12px;
  width: 100%;
  text-align: center;
  color: #fff;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1.2px;
  z-index: 2;
}

.title span {
  display: block;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  color: #ffdede;
}

/* ================= CONTENT ================= */
.content {
  flex: 1;
  padding: 14px;
  display: flex;
  gap: 14px;
  align-items: stretch;
}

/* ================= MANIFESTO ================= */
.manifesto {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.manifesto h3 {
  color: #8b0000;
  font-size: 15px;
  font-weight: 900;
  margin-bottom: 10px;
  border-left: 6px solid #8b0000;
  padding-left: 10px;
  text-transform: uppercase;
}

.manifesto ul {
  list-style: none;
}

.manifesto li {
  background: #ffffff;
  margin-bottom: 8px;
  padding: 9px 11px;
  border-radius: 10px;
  font-size: 12.5px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.manifesto li span {
  min-width: 24px;
  height: 24px;
  background: #8b0000;
  color: #fff;
  border-radius: 50%;
  font-size: 12px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ================= CANDIDATE ================= */
.candidate {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.candidate img {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  background: #fff;
  padding: 6px;
  border-radius: 16px;
  box-shadow: 0 18px 35px rgba(0,0,0,0.35);
}

/* ================= VOTE ================= */
.vote {
  text-align: center;
  padding: 10px;
  background: #ffffff;
}

.vote-text {
  color: #8b0000;
  font-size: 17px;
  font-weight: 900;
  text-transform: uppercase;
}

.vote h2 {
  font-size: 26px;
  font-weight: 900;
  margin: 4px 0;
}

.hashtag {
  font-size: 12px;
  font-weight: 600;
  color: #444;
}

/* ================= POSITION ================= */
.position {
  background: linear-gradient(to right, #8b0000, #b30000);
  color: #fff;
  text-align: center;
  padding: 14px;
  font-size: 21px;
  font-weight: 900;
  letter-spacing: 1px;
}

/* ================= MOBILE FIX ================= */
@media (max-width: 420px) {
  .content {
    flex-direction: column;
    justify-content: space-between;
  }

  .candidate {
    order: 1; /* IMAGE FIRST */
  }

  .manifesto {
    order: 2; /* MANIFESTO BELOW IMAGE */
  }

  .candidate img {
    max-height: 260px;
  }
}
</style>
</head>

<body>

<div class="poster">

  <!-- HERO -->
  <div class="hero">
    <div class="top-logos">
      <img src="LOGO1.jpeg" class="logo">
      <img src="LOGO2.jpeg" class="logo">
    </div>
    <div class="title">
      MKU
      <span>2026 / 2027</span>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="manifesto">
      <h3>Manifesto</h3>
      <ul>
        <li><span>1</span> Transparent & accountable leadership</li>
        <li><span>2</span> Effective communication</li>
        <li><span>3</span> Accessibility to students</li>
        <li><span>4</span> Inclusive representation</li>
        <li><span>5</span> Mental health awareness</li>
      </ul>
    </div>

    <div class="candidate">
      <img src="STEPHEN MULII.jpeg" alt="Stephen Mulii">
    </div>

  </div>

  <!-- VOTE -->
  <div class="vote">
    <div class="vote-text">Vote</div>
    <h2>MULI KITUV​A</h2>
    <div class="hashtag">#LeadershipYouCanReach</div>
  </div>

  <!-- POSITION -->
  <div class="position">
    Secretary General
  </div>

</div>

</body>
</html>
