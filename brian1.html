<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MKU 2026 / 2027 Poster</title>
  <style>

  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  background: #101010;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 12px;
}

/* ================= POSTER ================= */
.poster {
  width: 100%;
  max-width: 420px;
  background: #f4f6f8;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0,0,0,0.65);
}

/* ================= HERO IMAGE ================= */
.hero {
  background: url("MKU BACKGROUND.jpeg") center / cover no-repeat;
  height: 180px;
  position: relative;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.65)
  );
}

/* ================= LOGOS ================= */
.top-logos {
  position: absolute;
  top: 12px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 2;
}

.logo {
  width: 42px;
  background: #fff;
  padding: 5px;
  border-radius: 10px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.35);
}

/* ================= TITLE ================= */
.title {
  position: absolute;
  bottom: 14px;
  width: 100%;
  text-align: center;
  color: #ffffff;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 1.4px;
  z-index: 2;
  text-transform: uppercase;
}

.title span {
  display: block;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  margin-top: 2px;
  color: #ffdede;
}

/* ================= CONTENT ================= */
.content {
  padding: 18px;
  display: flex;
  gap: 18px;
}

/* ================= MANIFESTO ================= */
.manifesto {
  flex: 1.1;
}

.manifesto h3 {
  color: #8b0000;
  font-size: 17px;
  font-weight: 900;
  margin-bottom: 14px;
  padding-left: 12px;
  border-left: 6px solid #8b0000;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.manifesto ul {
  list-style: none;
}

.manifesto li {
  background: linear-gradient(135deg, #ffffff, #f7f7f7);
  margin-bottom: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 13.5px;
  color: #111;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  box-shadow: 0 6px 14px rgba(0,0,0,0.1);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.manifesto li:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.18);
}

.manifesto li span {
  min-width: 26px;
  height: 26px;
  background: #8b0000;
  color: #fff;
  border-radius: 50%;
  font-size: 13px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.25);
}

/* ================= CANDIDATE ================= */
.candidate {
  flex: 1.2;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.candidate img {
  width: 100%;
  max-height: 340px; /* BIGGER IMAGE */
  object-fit: contain;
  border-radius: 18px;
  background: #ffffff;
  padding: 8px;
  box-shadow: 0 18px 35px rgba(0,0,0,0.35);
  transform: translateY(-10px);
}

/* ================= VOTE ================= */
.vote {
  text-align: center;
  padding: 16px 10px;
  background: #ffffff;
  border-top: 1px solid #ddd;
}

.vote-text {
  color: #8b0000;
  font-size: 19px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.vote h2 {
  font-size: 28px;
  font-weight: 900;
  color: #000;
  margin: 6px 0;
}

.hashtag {
  font-size: 13px;
  color: #555;
  font-weight: 600;
}

/* ================= POSITION ================= */
.position {
  background: linear-gradient(to right, #8b0000, #b30000);
  color: #fff;
  text-align: center;
  padding: 18px;
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

/* ================= MOBILE ================= */
@media (max-width: 420px) {
  .content {
    flex-direction: column;
  }

  .candidate img {
    max-height: 360px;
    margin-top: 14px;
  }

  .title {
    font-size: 22px;
  }
}

@media (max-width: 360px) {
  .manifesto li {
    font-size: 12.5px;
  }
}
</style>
</head>

<body>

  <div class="poster">

    <!-- Hero / Background Image -->
    <div class="hero">
      <div class="top-logos">
        <img src="LOGO1.jpeg" class="logo" alt="MKU Logo">
        <img src="LOGO2.jpeg" class="logo" alt="MKUSA Logo">
      </div>

      <div class="title">
        MKU <span>2026 / 2027</span>
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <div class="manifesto">
        <h3>Manifesto</h3>
        <ul>
          <li><span>1</span> Transparent & accountable leadership</li>
          <li><span>2</span> Effective communication</li>
          <li><span>3</span> Accessibility to students</li>
          <li><span>4</span> Inclusive representation & student voice</li>
          <li><span>5</span> Mental health awareness</li>
        </ul>
      </div>

      <div class="candidate">
        <img src="STEPHEN MULII.jpeg" alt="Muli Kituva">
      </div>

    </div>

    <!-- Vote -->
    <div class="vote">
      <p class="vote-text">Vote</p>
      <h2>MULI KITUV​A</h2>
      <p class="hashtag">#LeadershipYouCanReach</p>
    </div>

    <!-- Position -->
    <div class="position">
      Secretary General
    </div>

  </div>

</body>
</html>
