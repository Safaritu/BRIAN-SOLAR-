<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MKUSA 2026/2027 Poster</title>
 
</head>
<body>
    <style>

    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* ================= POSTER ================= */
.poster {
  width: 100%;
  max-width: 420px;
  background:
    linear-gradient(
      rgba(255, 255, 255, 0.78),
      rgba(255, 255, 255, 0.78)
    ),
    url("MKU BACKGROUND.jpeg") center / cover no-repeat;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 15px 35px rgba(0,0,0,0.45);
}

/* ================= LOGOS ================= */
.top-logos {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
}

.logo {
  width: 52px;
  height: auto;
}

/* ================= TITLE ================= */
.title {
  background: linear-gradient(to right, #8b0000, #b00000);
  color: #fff;
  text-align: center;
  padding: 10px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
}

.title span {
  font-size: 17px;
}

/* ================= CONTENT ================= */
.content {
  display: flex;
  gap: 12px;
  padding: 14px;
}

/* Manifesto */
.manifesto {
  flex: 1.2;
}

.manifesto h3 {
  background: #1e4c7a;
  color: #fff;
  padding: 6px 10px;
  border-radius: 6px;
  margin-bottom: 8px;
  font-size: 15px;
}

.manifesto ul {
  list-style: decimal;
  padding-left: 18px;
  font-size: 13px;
  color: #111;
}

.manifesto li {
  margin-bottom: 6px;
}

/* Candidate */
.candidate {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.candidate img {
  width: 100%;
  max-height: 230px;
  object-fit: contain;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3));
}

/* ================= VOTE ================= */
.vote {
  text-align: center;
  padding: 10px 10px 6px;
}

.vote-text {
  font-size: 17px;
  color: #8b0000;
  font-weight: bold;
}

.vote h2 {
  font-size: 26px;
  font-weight: 900;
  color: #000;
}

.hashtag {
  font-size: 13px;
  color: #333;
}

/* ================= POSITION ================= */
.position {
  background: linear-gradient(to right, #8b0000, #b00000);
  color: #fff;
  text-align: center;
  padding: 14px;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

/* ================= MOBILE FIXES ================= */
@media (max-width: 420px) {

  .logo {
    width: 42px; /* FIX: logos no longer dominate screen */
  }

  .content {
    flex-direction: column; /* FIX: vertical layout on phone */
    align-items: center;
    text-align: left;
  }

  .manifesto {
    width: 100%;
  }

  .candidate img {
    max-height: 260px;
    margin-top: 10px;
  }

  .title {
    font-size: 20px;
  }

  .vote h2 {
    font-size: 23px;
  }

  .position {
    font-size: 20px;
  }
}

/* EXTRA SMALL PHONES */
@media (max-width: 360px) {

  .logo {
    width: 36px;
  }

  .manifesto ul {
    font-size: 12px;
  }
}
</style>

  <div class="poster">

    <!-- Top Logos -->
    <div class="top-logos">
      <img src="LOGO1.jpeg" alt="MKU Logo" class="logo left">
      <img src="LOGO2.jpeg" alt="MKUSA Logo" class="logo right">
    </div>

    <!-- Title -->
    <div class="title">
      MKUSA <span>2026 / 2027</span>
    </div>

    <!-- Main Content -->
    <div class="content">

      <!-- Manifesto -->
      <div class="manifesto">
        <h3>Manifesto</h3>
        <ul>
          <li>Transparent & accountable leadership</li>
          <li>Effective communication</li>
          <li>Accessibility to students</li>
          <li>Inclusive representation & student voice</li>
          <li>Mental health awareness</li>
        </ul>
      </div>

      <!-- Candidate -->
      <div class="candidate">
        <img src="STEPHEN MULII.jpeg" alt="Muli Kituva">
      </div>

    </div>

    <!-- Vote Section -->
    <div class="vote">
      <p class="vote-text">Vote</p>
      <h2>MULI KITUV​A</h2>
      <p class="hashtag">#LeadershipYouCanReach</p>
    </div>

    <!-- Position -->
    <div class="position">
      SECRETARY GENERAL
    </div>

  </div>

</body>
</html>
